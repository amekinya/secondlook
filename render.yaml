# One-click deploy on Render: New → Blueprint → pick this repo → paste your two keys when asked.
services:
  - type: web
    name: secondlook
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:  # data and eval commits from the pipeline workflows don't redeploy the demo
      ignoredPaths:
        - data/lookalike/**
        - eval/**
        - .github/**
        - train/**
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ENDPOINT_URL      # our Nebius endpoint (fine-tuned matcher); optional
        sync: false
      - key: ENDPOINT_TOKEN
        sync: false
      - key: DAILY_SPEND_CAP_USD
        value: "2"
