name: Look-alike matcher data and eval (live models)
# Runs when .github/requests/lookalike.json changes (so a step can be requested with a commit), or from the Actions tab.
#   {"task": "synth", "args": "--split trainval"}          writes listings with a non-Nemotron model, then rebuilds pairs
#   {"task": "synth", "args": "--split test --generator Qwen/Qwen3-30B-A3B-Instruct-2507"}
#   {"task": "eval",  "args": ""}                          needs ENDPOINT_URL / ENDPOINT_TOKEN secrets for the Nebius matcher
on:
  push:
    paths: [".github/requests/lookalike.json"]
  workflow_dispatch:
    inputs:
      task: { description: "synth | pairs | eval", required: true, default: "eval" }
      args: { description: "extra arguments", required: false, default: "" }
permissions:
  contents: write
concurrency: { group: lookalike, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          ENDPOINT_URL: ${{ secrets.ENDPOINT_URL }}
          ENDPOINT_TOKEN: ${{ secrets.ENDPOINT_TOKEN }}
          DAILY_SPEND_CAP_USD: "20"
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TASK=$(python -c "import json;print(json.load(open('.github/requests/lookalike.json'))['task'])")
            ARGS=$(python -c "import json;print(json.load(open('.github/requests/lookalike.json')).get('args',''))")
          else
            TASK="${{ inputs.task }}"; ARGS="${{ inputs.args }}"
          fi
          mkdir -p eval data/lookalike
          case "$TASK" in
            synth) python -m scripts.synth_lookalikes $ARGS 2>&1 | tee -a eval/lookalike_log.txt; python -m scripts.build_lookalike_pairs | tee -a eval/lookalike_log.txt ;;
            pairs) python -m scripts.build_lookalike_pairs | tee -a eval/lookalike_log.txt ;;
            eval)  python -m eval.lookalike_eval $ARGS 2>&1 | tee -a eval/lookalike_log.txt ;;
            chatbot) python -m eval.chatbot_baseline 2>&1 | tee eval/chatbot_baseline_log.txt ;;
          esac
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval data/lookalike 2>/dev/null || true
          git commit -m "Look-alike matcher: results" || echo "No changes"
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 7; done
