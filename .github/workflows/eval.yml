name: Benchmark (live models)
# Actions tab → "Benchmark (live models)" → Run workflow. Costs roughly $1-2 of Token Factory credits.
on:
  workflow_dispatch:
    inputs:
      reuse_matching: { description: "Keep the last recall-matching results (saves ~$1)", type: boolean, default: false }
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Run benchmark
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ "${{ inputs.reuse_matching }}" = "true" ]; then python -m eval.run_eval --reuse-matching; else python -m eval.run_eval; fi
          cat eval/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results.json eval/RESULTS.md
          git commit -m "Update benchmark results" || echo "No changes"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done